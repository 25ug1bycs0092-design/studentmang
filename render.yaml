services:
  - type: web
    name: campusly-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app backend:create_app init-db && gunicorn "backend:create_app()" --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusly-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "60"

databases:
  - name: campusly-db
    databaseName: campusly
    user: campusly
    plan: basic-256mb
